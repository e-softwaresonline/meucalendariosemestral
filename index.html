<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu calendário semestral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3A63;
    --navy-soft:#3C5A8A;
    --bg:#F1F2F5;
    --card:#FFFFFF;
    --border:#E1E3E8;
    --text:#333A45;
    --danger:#D9636C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  h1{
    color:var(--navy);
    font-weight:800;
    font-size:28px;
    margin-bottom:4px;
  }
  .subtitle{color:#6B7280;margin-bottom:24px;font-size:14px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 24px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(31,58,99,0.05);
  }
  .card h2{
    color:var(--navy);
    font-size:18px;
    font-weight:700;
    margin-top:0;
    margin-bottom:14px;
  }
  label{
    display:block;
    font-weight:600;
    font-size:13px;
    color:var(--navy-soft);
    margin-bottom:4px;
  }
  input[type=text], input[type=date]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    font-family:'Nunito',sans-serif;
    font-size:14px;
    background:#FAFBFC;
  }
  input:focus{outline:2px solid var(--navy-soft);outline-offset:1px;}
  .row-flex{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .row-flex > div{flex:1;min-width:160px;}
  .blocks-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .block-row{
    display:flex;gap:10px;align-items:end;
    background:#F7F8FA;padding:10px;border-radius:12px;
    border:1px solid var(--border);
    flex-wrap:wrap;
  }
  .block-row > div{flex:1;min-width:130px;}
  .block-row .hint{
    font-size:11px;color:#8A93A3;margin-top:3px;
  }
  button{
    font-family:'Nunito',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    transition:opacity .15s;
  }
  button:hover{opacity:.85;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-secondary{background:#E7ECF5;color:var(--navy);}
  .btn-danger{background:#FBE6E7;color:var(--danger);}
  .btn-remove-row{background:#FBE6E7;color:var(--danger);padding:9px 12px;}
  .btn-icon{padding:8px 12px;}
  .error-box{
    background:#FDECEC;border:1px solid #F3C6C8;color:#A83A41;
    padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;
    display:none;
  }
  .disc-cards{display:flex;flex-direction:column;gap:10px;}
  .disc-card{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  }
  .swatch{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
  .disc-info{flex:1;}
  .disc-name{font-weight:700;color:var(--navy);font-size:15px;}
  .disc-blocks{font-size:12px;color:#6B7280;margin-top:2px;line-height:1.5;}
  .disc-actions{display:flex;gap:8px;}
  .empty-msg{color:#8A93A3;font-size:14px;font-style:italic;}

  /* Controls */
  .controls{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;margin-bottom:16px;
  }
  .view-toggle{display:flex;gap:6px;background:#E7ECF5;padding:4px;border-radius:12px;}
  .view-toggle button{background:transparent;color:var(--navy);padding:7px 16px;}
  .view-toggle button.active{background:var(--navy);color:#fff;}
  .nav-controls{display:flex;align-items:center;gap:10px;}
  .nav-controls .label{font-weight:800;color:var(--navy);font-size:16px;min-width:170px;text-align:center;}
  .nav-btn{background:#E7ECF5;color:var(--navy);padding:7px 12px;font-size:15px;}

  /* Legend */
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--navy-soft);font-weight:600;}
  .legend-dot{width:10px;height:10px;border-radius:50%;}

  /* Month view */
  .month-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  }
  .weekday-head{
    text-align:center;font-weight:700;color:var(--navy);font-size:12px;
    padding-bottom:6px;text-transform:uppercase;letter-spacing:.03em;
  }
  .day-cell{
    background:#FAFBFC;border:1px solid var(--border);border-radius:10px;
    min-height:100px;padding:6px;display:flex;flex-direction:column;gap:3px;
  }
  .day-cell.empty{background:transparent;border:none;}
  .day-cell.today{border:2px solid var(--navy);}
  .day-num{font-size:12px;font-weight:700;color:var(--navy-soft);margin-bottom:2px;}
  .chip{
    border-radius:6px;padding:2px 5px;font-size:10px;font-weight:700;
    color:var(--navy);line-height:1.3;
  }
  .chip .time{font-weight:400;font-size:9px;display:block;color:#4B5567;}

  /* Year view */
  .year-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  }
  .mini-month{
    background:#FAFBFC;border:1px solid var(--border);border-radius:12px;padding:10px;
  }
  .mini-month h3{
    text-align:center;color:var(--navy);font-size:13px;margin:0 0 8px 0;text-transform:capitalize;
  }
  .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .mini-wd{text-align:center;font-size:8px;color:#9AA2AF;font-weight:700;}
  .mini-day{
    text-align:center;font-size:9px;padding:3px 0;border-radius:5px;position:relative;color:#555;
  }
  .mini-day.today{border:1px solid var(--navy);font-weight:800;}
  .mini-dots{display:flex;justify-content:center;gap:1px;margin-top:1px;}
  .mini-dot{width:4px;height:4px;border-radius:50%;}

  .pdf-btn{background:var(--navy);color:#fff;}
  .save-note{font-size:12px;color:#8A93A3;margin-left:6px;}

  @media print{
    body{background:#fff;padding:0;}
    .no-print{display:none !important;}
    .card.calendar-card{box-shadow:none;border:none;padding:0;}
    .wrap{max-width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>📅 Calendário de Disciplinas</h1>
  <p class="subtitle">Cadastre suas disciplinas e horários e visualize o cronograma do mês ou do ano.</p>

  <div class="card no-print">
    <h2 id="form-title">Adicionar Disciplina</h2>
    <div id="error-box" class="error-box"></div>

    <label for="input-nome">Nome da disciplina</label>
    <input type="text" id="input-nome" placeholder="Ex: Anatomia Humana" style="margin-bottom:14px;">

    <label>Horários</label>
    <div class="blocks-list" id="blocks-list"></div>
    <button class="btn-secondary" id="btn-add-block" type="button">+ Adicionar horário</button>

    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn-primary" id="btn-save-disc" type="button">Salvar Disciplina</button>
      <button class="btn-secondary" id="btn-cancel-edit" type="button" style="display:none;">Cancelar edição</button>
    </div>
  </div>

  <div class="card no-print">
    <h2>Disciplinas cadastradas</h2>
    <div class="disc-cards" id="disc-cards">
      <p class="empty-msg">Nenhuma disciplina cadastrada ainda.</p>
    </div>
  </div>

  <div class="card calendar-card">
    <div class="controls no-print">
      <div class="view-toggle">
        <button id="btn-view-month" class="active" type="button">Mês</button>
        <button id="btn-view-year" type="button">Ano</button>
      </div>
      <div class="nav-controls">
        <button class="nav-btn" id="btn-prev" type="button">‹</button>
        <span class="label" id="nav-label"></span>
        <button class="nav-btn" id="btn-next" type="button">›</button>
      </div>
      <div>
        <button class="pdf-btn" id="btn-pdf" type="button">⬇ Salvar em PDF</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div id="calendar-container"></div>
  </div>

</div>

<script>
(function(){
  const PALETTE = ['#FFD6E8','#D6EAF8','#D5F5E3','#FFF3CD','#E8DAEF','#FADBD8',
                    '#D6DBF5','#FDEBD0','#D0F0F5','#F5D6E0','#E0F5D6','#F5E0D6',
                    '#F9D6D0','#D6F5EA'];

  const TIMES = {
    M:{1:['07:00','07:50'],2:['07:50','08:40'],3:['08:55','09:45'],4:['09:45','10:35'],5:['10:50','11:40'],6:['11:40','12:30']},
    T:{1:['13:00','13:50'],2:['13:50','14:40'],3:['14:55','15:45'],4:['15:45','16:35'],5:['16:50','17:40'],6:['17:40','18:30']},
    N:{1:['18:45','19:35'],2:['19:35','20:25'],3:['20:35','21:25'],4:['21:25','22:15']}
  };
  const DAY_NAMES = {2:'Segunda',3:'Terça',4:'Quarta',5:'Quinta',6:'Sexta',7:'Sábado'};
  const WEEKDAY_HEAD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  let disciplinas = [];
  let editingId = null;
  let currentView = 'month';
  let currentDate = new Date();
  let storageReady = true;

  // ---------- helpers ----------
  function toDateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dateFromInput(str){ const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
  function formatBR(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  function parseCode(code){
    code = code.trim().toUpperCase();
    const m = code.match(/^([2-7])([MTN])([1-6]{1,6})$/);
    if(!m) return {error:'Formato inválido. Use algo como "2M3456".'};
    const dayNum = parseInt(m[1],10);
    const turno = m[2];
    const slotsStr = m[3];
    const slots = slotsStr.split('').map(Number);
    const table = TIMES[turno];
    for(const s of slots){
      if(!table[s]) return {error:'Horário "'+s+'" não existe no turno '+turno+'.'};
    }
    const sorted = [...slots].sort((a,b)=>a-b);
    const timeStart = table[sorted[0]][0];
    const timeEnd = table[sorted[sorted.length-1]][1];
    return {dayNum, turno, slots: sorted, timeStart, timeEnd, jsDay: dayNum-1, dayName: DAY_NAMES[dayNum]};
  }

  // ---------- storage (localStorage do navegador) ----------
  const STORAGE_KEY = 'calendario-disciplinas-v1';

  function persist(){
    try{
      const serializable = disciplinas.map(d=>({
        id:d.id, nome:d.nome, color:d.color,
        blocks:d.blocks.map(b=>({code:b.code, start:b.startStr, end:b.endStr}))
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializable));
    }catch(e){ console.warn('Falha ao salvar', e); }
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const arr = JSON.parse(raw);
        disciplinas = arr.map(d=>({
          id:d.id, nome:d.nome, color:d.color,
          blocks:d.blocks.map(b=>{
            const parsed = parseCode(b.code);
            return {code:b.code, startStr:b.start, endStr:b.end,
                     start: dateFromInput(b.start), end: dateFromInput(b.end),
                     ...parsed};
          })
        }));
      }
    }catch(e){ /* nada salvo ainda */ }
    renderAll();
  }

  // ---------- form: block rows ----------
  const blocksListEl = document.getElementById('blocks-list');

  function addBlockRow(values){
    values = values || {code:'', start:'', end:''};
    const row = document.createElement('div');
    row.className = 'block-row';
    row.innerHTML = `
      <div>
        <label>Código</label>
        <input type="text" class="inp-code" placeholder="Ex: 2M3456" value="${values.code}">
        <div class="hint">dia+turno+horários</div>
      </div>
      <div>
        <label>Data início</label>
        <input type="date" class="inp-start" value="${values.start}">
      </div>
      <div>
        <label>Data fim</label>
        <input type="date" class="inp-end" value="${values.end}">
      </div>
      <button type="button" class="btn-remove-row">✕</button>
    `;
    row.querySelector('.btn-remove-row').addEventListener('click', ()=>{
      if(blocksListEl.children.length > 1) row.remove();
    });
    blocksListEl.appendChild(row);
  }

  document.getElementById('btn-add-block').addEventListener('click', ()=>addBlockRow());

  function resetForm(){
    document.getElementById('input-nome').value = '';
    blocksListEl.innerHTML = '';
    addBlockRow();
    editingId = null;
    document.getElementById('form-title').textContent = 'Adicionar Disciplina';
    document.getElementById('btn-cancel-edit').style.display = 'none';
    hideError();
  }

  function showError(msg){
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }
  function hideError(){
    document.getElementById('error-box').style.display = 'none';
  }

  document.getElementById('btn-cancel-edit').addEventListener('click', resetForm);

  document.getElementById('btn-save-disc').addEventListener('click', async ()=>{
    hideError();
    const nome = document.getElementById('input-nome').value.trim();
    if(!nome){ showError('Informe o nome da disciplina.'); return; }

    const rows = Array.from(blocksListEl.querySelectorAll('.block-row'));
    if(rows.length===0){ showError('Adicione ao menos um horário.'); return; }

    const blocks = [];
    for(const row of rows){
      const code = row.querySelector('.inp-code').value.trim();
      const startStr = row.querySelector('.inp-start').value;
      const endStr = row.querySelector('.inp-end').value;
      if(!code || !startStr || !endStr){
        showError('Preencha código, data início e data fim em todos os horários.');
        return;
      }
      const parsed = parseCode(code);
      if(parsed.error){ showError(parsed.error); return; }
      const start = dateFromInput(startStr);
      const end = dateFromInput(endStr);
      if(end < start){ showError('A data fim não pode ser anterior à data início ('+code+').'); return; }
      blocks.push({code: code.toUpperCase(), startStr, endStr, start, end, ...parsed});
    }

    if(editingId){
      const idx = disciplinas.findIndex(d=>d.id===editingId);
      const color = idx>=0 ? disciplinas[idx].color : PALETTE[disciplinas.length % PALETTE.length];
      const updated = {id: editingId, nome, color, blocks};
      if(idx>=0) disciplinas[idx] = updated; else disciplinas.push(updated);
    } else {
      const color = PALETTE[disciplinas.length % PALETTE.length];
      disciplinas.push({id: 'd'+Date.now()+Math.floor(Math.random()*1000), nome, color, blocks});
    }

    resetForm();
    persist();
    renderAll();
  });

  function editDisciplina(id){
    const d = disciplinas.find(x=>x.id===id);
    if(!d) return;
    document.getElementById('input-nome').value = d.nome;
    blocksListEl.innerHTML = '';
    d.blocks.forEach(b=>addBlockRow({code:b.code, start:b.startStr, end:b.endStr}));
    editingId = id;
    document.getElementById('form-title').textContent = 'Editar Disciplina';
    document.getElementById('btn-cancel-edit').style.display = 'inline-block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  async function deleteDisciplina(id){
    disciplinas = disciplinas.filter(d=>d.id!==id);
    persist();
    renderAll();
  }
  window.editDisciplina = editDisciplina;
  window.deleteDisciplina = deleteDisciplina;

  // ---------- render list of disciplinas ----------
  function renderDiscList(){
    const el = document.getElementById('disc-cards');
    if(disciplinas.length===0){
      el.innerHTML = '<p class="empty-msg">Nenhuma disciplina cadastrada ainda.</p>';
      return;
    }
    el.innerHTML = disciplinas.map(d=>{
      const blocksTxt = d.blocks.map(b=>
        `${b.dayName} (${b.turno}) ${b.timeStart}–${b.timeEnd} · ${formatBR(b.start)} a ${formatBR(b.end)}`
      ).join('<br>');
      return `
        <div class="disc-card" style="background:${d.color}22;">
          <span class="swatch" style="background:${d.color};"></span>
          <div class="disc-info">
            <div class="disc-name">${d.nome}</div>
            <div class="disc-blocks">${blocksTxt}</div>
          </div>
          <div class="disc-actions">
            <button class="btn-secondary btn-icon" onclick="editDisciplina('${d.id}')">✎</button>
            <button class="btn-danger btn-icon" onclick="deleteDisciplina('${d.id}')">🗑</button>
          </div>
        </div>`;
    }).join('');
  }

  // ---------- legend ----------
  function renderLegend(){
    const el = document.getElementById('legend');
    if(disciplinas.length===0){ el.innerHTML=''; return; }
    el.innerHTML = disciplinas.map(d=>`
      <div class="legend-item">
        <span class="legend-dot" style="background:${d.color};"></span>${d.nome}
      </div>`).join('');
  }

  // ---------- calendar: which disciplinas active on a date ----------
  function activeOn(date){
    const jsDay = date.getDay();
    const result = [];
    disciplinas.forEach(d=>{
      d.blocks.forEach(b=>{
        if(b.jsDay===jsDay && date>=b.start && date<=b.end){
          result.push({nome:d.nome, color:d.color, timeStart:b.timeStart, timeEnd:b.timeEnd});
        }
      });
    });
    return result;
  }

  // ---------- month view ----------
  function renderMonthView(container, year, month){
    const first = new Date(year, month, 1);
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const startWeekday = first.getDay();
    const today = toDateOnly(new Date());

    let html = '<div class="month-grid">';
    WEEKDAY_HEAD.forEach(w=> html += `<div class="weekday-head">${w}</div>`);

    for(let i=0;i<startWeekday;i++) html += '<div class="day-cell empty"></div>';

    for(let day=1; day<=daysInMonth; day++){
      const date = new Date(year, month, day);
      const acts = activeOn(date);
      const isToday = sameDay(date, today);
      let chips = acts.map(a=>`
        <div class="chip" style="background:${a.color};">
          ${a.nome}
          <span class="time">${a.timeStart}–${a.timeEnd}</span>
        </div>`).join('');
      html += `<div class="day-cell ${isToday?'today':''}">
                  <div class="day-num">${day}</div>
                  ${chips}
                </div>`;
    }
    html += '</div>';
    container.innerHTML = html;
  }

  // ---------- year view ----------
  function renderYearView(container, year){
    const today = toDateOnly(new Date());
    let html = '<div class="year-grid">';
    for(let m=0;m<12;m++){
      const first = new Date(year, m, 1);
      const daysInMonth = new Date(year, m+1, 0).getDate();
      const startWeekday = first.getDay();
      html += `<div class="mini-month"><h3>${MONTH_NAMES[m]}</h3><div class="mini-grid">`;
      WEEKDAY_HEAD.forEach(w=> html += `<div class="mini-wd">${w[0]}</div>`);
      for(let i=0;i<startWeekday;i++) html += '<div></div>';
      for(let day=1; day<=daysInMonth; day++){
        const date = new Date(year, m, day);
        const acts = activeOn(date);
        const isToday = sameDay(date, today);
        const dots = acts.slice(0,4).map(a=>`<span class="mini-dot" style="background:${a.color};"></span>`).join('');
        const titleTxt = acts.map(a=>a.nome+' '+a.timeStart+'-'+a.timeEnd).join(' | ');
        html += `<div class="mini-day ${isToday?'today':''}" title="${titleTxt}">
                    ${day}
                    <div class="mini-dots">${dots}</div>
                  </div>`;
      }
      html += '</div></div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  // ---------- nav / view controls ----------
  function updateNavLabel(){
    const label = document.getElementById('nav-label');
    if(currentView==='month'){
      label.textContent = MONTH_NAMES[currentDate.getMonth()] + ' de ' + currentDate.getFullYear();
    } else {
      label.textContent = String(currentDate.getFullYear());
    }
  }

  function renderCalendar(){
    const container = document.getElementById('calendar-container');
    if(currentView==='month'){
      renderMonthView(container, currentDate.getFullYear(), currentDate.getMonth());
    } else {
      renderYearView(container, currentDate.getFullYear());
    }
    updateNavLabel();
  }

  document.getElementById('btn-view-month').addEventListener('click', ()=>{
    currentView='month';
    document.getElementById('btn-view-month').classList.add('active');
    document.getElementById('btn-view-year').classList.remove('active');
    renderCalendar();
  });
  document.getElementById('btn-view-year').addEventListener('click', ()=>{
    currentView='year';
    document.getElementById('btn-view-year').classList.add('active');
    document.getElementById('btn-view-month').classList.remove('active');
    renderCalendar();
  });
  document.getElementById('btn-prev').addEventListener('click', ()=>{
    if(currentView==='month') currentDate.setMonth(currentDate.getMonth()-1);
    else currentDate.setFullYear(currentDate.getFullYear()-1);
    currentDate = new Date(currentDate);
    renderCalendar();
  });
  document.getElementById('btn-next').addEventListener('click', ()=>{
    if(currentView==='month') currentDate.setMonth(currentDate.getMonth()+1);
    else currentDate.setFullYear(currentDate.getFullYear()+1);
    currentDate = new Date(currentDate);
    renderCalendar();
  });
  document.getElementById('btn-pdf').addEventListener('click', ()=>{
    window.print();
  });

  function renderAll(){
    renderDiscList();
    renderLegend();
    renderCalendar();
  }

  // init
